[package]
name = "Ruvault"
version = "0.0.1"
edition = "2024"

[dependencies]

# TUI
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
ratatui-textarea = "0.9.2"
tui-input = "0.15.4"

# Async / Concurrency
tokio = { version = "1", features = ["full"] }

# Error Handling
error-stack = "0.8"
thiserror = "2"

# Logging / Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization / Data Model
serde = { version = "1", features = ["derive"] }

# IDs
uuid = { version = "1.25", features = ["v7"] }

# Cryptography
argon2 = "0.5"
aes-gcm = "0.11"
sha2 = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Secure Randomness
rand = "0.9"
# ed25519-dalek/x25519-dalek 2.x key generation is written against the
# rand_core 0.6 CryptoRngCore trait, which is a different (incompatible)
# major version from the rand_core that `rand = "0.9"` uses internally.
# We pull rand_core 0.6 in explicitly, only for its OsRng, and only at the
# few call sites that generate dalek keypairs -- everything else in the
# codebase keeps using `rand` 0.9 as before.
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }

# Secret / Key Memory Protection
zeroize = { version = "1", features = ["derive"] }

# Binary Encoding / Decoding
bytes = "1"

# File / Temp File Handling
tempfile = "3"
